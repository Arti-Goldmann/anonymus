# anonymus — настройки синхронизации проекта и песочницы.
# Этот файл содержит РЕАЛЬНЫЕ имена: не коммитьте его (anonymus init добавляет
# его в .gitignore).

version: 1

# Проект — git-репозиторий: у каждой подпесочницы своя ветка и свой git worktree
# проекта, все синхронизируются одновременно (клавиша n — новая). Сама папка
# проекта не синхронизируется — в ней можно переключать ветки как угодно.
#
# Куда класть песочницы подпесочниц (относительно этого файла или абсолютный
# путь; не внутри проекта):
sandboxes_dir: ../sandboxes
# Куда класть их git worktree. По умолчанию — рядом с проектом: <проект>.worktrees.
# worktrees_dir: ../proj.worktrees

# Проект без git: одна песочница, синхронизируется сама папка проекта.
# sandbox: ../sandbox1

sync:
  # Что синхронизировать — ЯВНО. "**" означает весь проект.
  # Синтаксис как в .gitignore:
  #   src/         папка src на любой глубине (/src/ — только в корне)
  #   *.c          все .c файлы
  #   CMakeLists.txt
  include:
    - "**"

  # Что синхронизировать НЕЛЬЗЯ (проверяется после include):
  #   .venv*       .venv, .venv-ubuntu, .venv2 ... на любой глубине
  #   .venv        только папки/файлы с именем ровно .venv
  #   /build       только build в корне проекта (src/build не затронет)
  #   src/gen/a.c  строго этот файл
  exclude:
    - .venv*
    - node_modules/
    - __pycache__/
    - /build
    - .vscode/
    - .idea/
    - "*.env"
    - "*.key"
    - "*.pem"

  # Дополнительные бинарные шаблоны (копируются как есть, без замен).
  # Картинки, архивы, шрифты, .bin/.hex/.elf и т.п. уже входят по умолчанию.
  binary: []

  # Кодировка файлов проекта: auto (UTF-8, иначе win1251) | utf8 | win1251.
  encoding: auto
  # keep — в песочнице та же кодировка, что в проекте;
  # utf8 — в песочнице всегда UTF-8 (агентам так проще), а в проект
  #        файлы пишутся обратно в его собственной кодировке.
  sandbox_encoding: keep

  # true — опрашивать файловую систему, если изменения из Docker-контейнера
  # не замечаются.
  poll: false
  debounce_ms: 300

# Таблица замен: real (в проекте) <-> placeholder (в песочнице).
# Замены применяются и к содержимому, и к именам файлов/папок:
# BIGcorpProject_cpu01/main.c  <->  MyProject_cpu01/main.c
replacements:
  - real: "BIGcorpProject"
    placeholder: "MyProject"
    variants: auto        # auto — ещё camelCase/snake_case/UPPER-варианты
    description: "Имя проекта заказчика"

  - real: "romashka.ru"
    placeholder: "example.com"
    variants: exact       # exact — только точное совпадение

  # Многострочный текст можно вставлять как есть, с реальными переносами.
  # Закрывающая кавычка должна стоять в конце строки.
  # - real: "Первая строка
  # Вторая строка"
  #   placeholder: "Some text"
